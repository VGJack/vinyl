<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'none'; object-src 'none'; base-uri 'none'"/>
  <title>Vinyl</title>
  <link rel="icon" href="../assets/logo-outline.svg" type="image/svg+xml"/>
  <link rel="stylesheet" href="./styles.css"/>
  <link rel="stylesheet" href="./material.css"/>
</head>
<body data-theme="light" data-accent="blue" data-shelf="closed">
  <div id="launch-splash" class="launch-splash" aria-label="Launching Vinyl">
    <div class="splash-lockup">
      <svg class="material-emblem" viewBox="0 0 256 256" role="img" aria-label="Vinyl V logo">
        <defs>
          <linearGradient id="splash-glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e8f3f7"/></linearGradient>
          <linearGradient id="splash-left" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".96"/><stop offset=".27" stop-color="#c5eaff" stop-opacity=".88"/><stop offset="1" stop-color="#73b9e9" stop-opacity=".84"/></linearGradient>
          <linearGradient id="splash-right" x1="1" y1="0" x2="0" y2="1"><stop stop-color="#fff" stop-opacity=".96"/><stop offset=".27" stop-color="#c1f0e7" stop-opacity=".85"/><stop offset="1" stop-color="#6bbcc1" stop-opacity=".8"/></linearGradient>
          <linearGradient id="splash-fold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".92"/><stop offset="1" stop-color="#a4d3e9" stop-opacity=".56"/></linearGradient>
          <clipPath id="left-unroll"><rect class="unroll-mask mask-left" x="25" y="34" width="140" height="190"/></clipPath>
          <clipPath id="right-unroll"><rect class="unroll-mask mask-right" x="95" y="34" width="140" height="190"/></clipPath>
          <linearGradient id="roll-cylinder" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#77aac6"/><stop offset=".35" stop-color="#faffff"/><stop offset=".6" stop-color="#d4edf5"/><stop offset="1" stop-color="#729eb4"/></linearGradient>
          <filter id="splash-shadow" x="-40%" y="-40%" width="180%" height="180%"><feDropShadow dx="0" dy="9" stdDeviation="9" flood-color="#295574" flood-opacity=".12"/></filter>
        </defs>
        <g filter="url(#splash-shadow)">
          <rect class="splash-plate" x="12" y="12" width="232" height="232" rx="62" fill="url(#splash-glass)" stroke="#fff" stroke-width="7"/>
          <g class="splash-arm splash-arm-left" clip-path="url(#left-unroll)">
            <path d="M42 58c-3-7 3-14 11-14h38c6 0 10 4 12 9l43 106-18 48c-2 5-7 9-13 9h-9c-6 0-10-4-13-10Z" fill="url(#splash-left)" stroke="#fff" stroke-opacity=".95" stroke-width="6" stroke-linejoin="round"/>
            <path d="M42 58c-3-7 3-14 11-14h38c6 0 10 4 12 9l5 14H57c-7 0-11-2-15-9" fill="url(#splash-fold)" stroke="#fff" stroke-width="2" stroke-opacity=".7"/>
          </g>
          <g class="splash-arm splash-arm-right" clip-path="url(#right-unroll)">
            <path d="M211 58c3-7-3-14-11-14h-38c-6 0-10 4-12 9l-43 106 18 48c2 5 7 9 13 9h9c6 0 10-4 13-10Z" fill="url(#splash-right)" stroke="#fff" stroke-opacity=".95" stroke-width="6" stroke-linejoin="round"/>
            <path d="M211 58c3-7-3-14-11-14h-38c-6 0-10 4-12 9l-5 14h51c7 0 11-2 15-9" fill="url(#splash-fold)" stroke="#fff" stroke-width="2" stroke-opacity=".7"/>
          </g>
          <g class="splash-curl curl-left"><ellipse cx="76" cy="49" rx="28" ry="10" fill="url(#roll-cylinder)" stroke="#fff" stroke-width="2"/><ellipse cx="97" cy="49" rx="6" ry="8" fill="#81afc4" stroke="#e9fbff" stroke-width="2"/></g>
          <g class="splash-curl curl-right"><ellipse cx="178" cy="49" rx="28" ry="10" fill="url(#roll-cylinder)" stroke="#fff" stroke-width="2"/><ellipse cx="157" cy="49" rx="6" ry="8" fill="#81afc4" stroke="#e9fbff" stroke-width="2"/></g>
          <path class="splash-overlap" d="M125 195l-5 12c-3 7-5 9-11 9h-3c-6 0-10-4-13-10l-6-15 20-32Z" fill="#c9e7f2" fill-opacity=".58"/>
        </g>
      </svg>
    </div>
  </div>
  <div id="shell">
    <header class="tabstrip">
      <div class="tablist" id="tabs" role="tablist"></div>
      <button class="icon-button newtab-button" id="newtab" title="Open Home (Ctrl+T)" aria-label="Open Home"></button>
      <div class="title-drag-region"></div>
      <div class="window-controls" aria-label="Window controls">
        <button id="more-menu" class="window-control" title="Settings" aria-label="Settings"></button>
        <button id="window-min" class="window-control" title="Minimize" aria-label="Minimize"></button>
        <button id="window-max" class="window-control" title="Maximize or restore" aria-label="Maximize or restore"></button>
        <button id="window-close" class="window-control close-control" title="Close Vinyl" aria-label="Close"></button>
      </div>
    </header>
    <div class="toolbar" id="browser-controls" aria-label="Browser controls">
      <div class="navigation">
        <button class="icon-button" id="back" title="Back (Alt+Left)" aria-label="Back"></button>
        <button class="icon-button" id="forward" title="Forward (Alt+Right)" aria-label="Forward"></button>
        <button class="icon-button" id="reload" title="Reload (Ctrl+R)" aria-label="Reload"></button>
      </div>
      <div class="address-field" id="address-field">
        <span class="address-lock" id="address-icon"></span>
        <input id="address" autocomplete="off" spellcheck="false" placeholder="Search or enter a website address" aria-label="Address or search"/>
        <button id="bookmark-current" class="icon-button small-icon" title="Bookmark this page (Ctrl+D)" aria-label="Bookmark this page"></button>
      </div>
      <div class="dock-actions">
        <button class="shelf-toggle tab-shelf-toggle" id="shelf-open" title="Bookmarks (Ctrl+Shift+B)" aria-label="Open bookmarks" aria-expanded="false"></button>
        <button class="icon-button" id="toggles-open" title="Toggles" aria-label="Open Toggles" aria-expanded="false"></button>
        <button class="icon-button google-profile" id="google-profile" data-action="google-profile" title="Sign in to Google" aria-label="Sign in to Google"></button>
      </div>
    </div>
    <button id="dock-close" class="dock-close" title="Hide browser controls" aria-label="Hide browser controls" aria-controls="browser-controls"></button>
    <button id="dock-reveal" class="dock-reveal" title="Show browser controls" aria-label="Show browser controls" aria-controls="browser-controls"></button>
    <div class="workspace" id="workspace">
      <aside class="shelf" id="shelf" aria-label="Vinyl shelf" inert>
        <div class="shelf-head">
          <div class="shelf-heading" id="shelf-heading">Bookmarks</div>
          <button class="icon-button" id="close-shelf" aria-label="Close shelf" title="Close shelf"></button>
        </div>
        <nav class="shelf-sections" aria-label="Shelf sections"><button class="section-pill" data-action="shelf-section" data-section="bookmarks">Bookmarks</button><button class="section-pill" data-action="shelf-section" data-section="toggles">Toggles</button></nav>
        <div class="shelf-content" id="shelf-content"></div>

      </aside>
      <main class="page-viewport" id="pageViewport">
        <div id="settings-page" class="settings-page" hidden>
          <div class="settings-layout">
            <nav class="settings-nav" id="settings-nav" aria-label="Settings sections">
              <div class="settings-nav-title">Settings</div>
              <button class="settings-nav-item current" data-settings-section="appearance">Appearance</button>
              <button class="settings-nav-item" data-settings-section="browser">Browser</button>
              <button class="settings-nav-item" data-settings-section="privacy">Privacy</button>
              <button class="settings-nav-item" data-settings-section="account">Accounts</button>
              <button class="settings-nav-item" data-settings-section="chrome">Chrome data</button>
              <button class="settings-nav-item" data-settings-section="about">About Vinyl</button>
            </nav>
            <div class="settings-scroll" id="settings-scroll"><div class="settings-main" id="settings-main"></div></div>
          </div>
        </div>
        <div class="home" id="home">
          <div class="home-content">
            <div class="home-intro home-reveal" style="--delay:0ms">
              <div class="home-greeting">
                <span class="home-dateline" id="home-date"></span>
                <h1 id="home-greeting">Good morning, Jack<span class="period">.</span></h1>
              </div>
              <div class="home-time" aria-label="Current local time"><span id="home-clock">--:--</span><span class="home-ampm" id="home-ampm"></span></div>
            </div>
            <div class="home-grid">
              <section class="home-start home-reveal" aria-label="Search and shortcuts">
                <div class="home-search" id="home-search"><span id="home-search-icon"></span><input type="text" id="home-address" placeholder="Search or enter a URL" aria-label="Search the web"/><div class="keycap">↵</div></div>
                <div class="home-shortcuts" id="home-shortcuts"></div>
              </section>
              <section class="home-weather home-reveal" id="weather-block" aria-label="Weather">
                <div class="home-section-head"><h2>Weather</h2><button class="home-text-action" data-action="weather-location" title="Change weather city">City</button></div>
                <div id="home-weather-content" class="home-weather-content"></div>
              </section>
              <section class="home-news home-reveal" id="news-block" aria-label="News">
                <div class="home-section-head"><h2>News</h2><button class="home-text-action" data-action="refresh-news" title="Refresh news">Refresh</button></div>
                <div id="home-news-items" class="home-news-items"></div>
              </section>
              <section class="home-section home-reveal" id="recent-block" aria-label="Recent tabs">
                <div class="home-section-head"><h2>Recent tabs</h2></div><div class="recent-tabs" id="home-recents"></div>
              </section>
            </div>
          </div>
          
        </div>
      </main>
    </div>
  </div>
  <div id="context-menu" class="context-menu hidden"></div>
  <div id="modal-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="./app.js" defer></script>
</body>
</html>
