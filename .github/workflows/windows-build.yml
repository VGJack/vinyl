name: Windows installer
on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install
      - name: Verify sources
        run: npm run check
      - name: Build Vinyl installer
        run: npm run build:win
      - uses: actions/upload-artifact@v4
        with:
          name: Vinyl-Windows-Installer
          path: dist/Vinyl-Setup-*.exe
          if-no-files-found: error
