name: Vinyl Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: vinyl-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        shell: pwsh
        run: |
          if (Test-Path package-lock.json) { npm ci }
          else { npm install --no-audit --no-fund }
      - name: Verify Vinyl
        run: npm run check
      - name: Verify release version
        if: startsWith(github.ref, 'refs/tags/v')
        run: node scripts/check-release-tag.js
      - name: Build development installer
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: npm run build:win
      - name: Build and upload GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm run publish:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Keep Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vinyl-Windows-${{ github.ref_name }}
          path: |
            dist/Vinyl-Setup-*.exe
            dist/latest.yml
          if-no-files-found: error
