name: Vinyl Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: vinyl-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm ci
      - name: Verify Vinyl
        run: npm run check
      - name: Assign automatic build version
        id: version
        run: node scripts/prepare-update.js
      - name: Build Windows update
        run: npm run build:win
      - name: Keep Windows build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Vinyl-Windows-${{ steps.version.outputs.version }}
          path: |
            dist/Vinyl-Setup-*.exe
            dist/Vinyl-Setup-*.exe.blockmap
            dist/latest.yml
          if-no-files-found: error
      - name: Make complete update available automatically
        uses: actions/github-script@v7
        with:
          script: |
            const {publishUpdate} = require('./scripts/publish-update.cjs');
            await publishUpdate({github, context, core});
